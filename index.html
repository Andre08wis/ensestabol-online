<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncestaBol Online - 1vs1 & Skins</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #1a1a2e; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 30px; }
    header { margin-top: 15px; text-align: center; }
    .card { background: #16213e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; margin-top: 15px; }
    input { width: 48%; padding: 10px; margin: 5px 1%; border: none; border-radius: 6px; background: #0f3460; color: white; text-align: center; }
    button { width: 100%; padding: 12px; background: #2ecc71; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #27ae60; }
    .hidden { display: none; }
    
    /* Selector de Skins */
    .skins-container { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
    .skin-opt { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
    .skin-opt.selected { border-color: #fff; transform: scale(1.1); }

    /* Cancha de juego */
    #court { position: relative; width: 300px; height: 320px; background: #0f3460; border: 3px solid #2ecc71; border-radius: 10px; margin: 15px auto; overflow: hidden; }
    .cartuchera { position: absolute; width: 90px; height: 35px; background: #ff9f43; border: 2px solid #fff; border-radius: 6px; left: 105px; text-align: center; line-height: 35px; font-size: 11px; font-weight: bold; color: #000; }
    #cartuchera-p1 { top: 10px; }
    
    .ball { position: absolute; width: 22px; height: 22px; border-radius: 50%; left: 139px; transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
    
    .stats { display: flex; justify-content: space-between; font-weight: bold; background: #0f3460; padding: 10px; border-radius: 8px; }
    .turn-indicator { color: #f1c40f; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

  <header>
    <h1>🏀 EncestaBol 1vs1</h1>
    <p>Distancia: 3 Pies | Multijugador & Skins</p>
  </header>

  <!-- Menú Inicial -->
  <div id="setup-card" class="card">
    <h2>Configurar Partida 1vs1</h2>
    
    <div style="display:flex; justify-content: space-between;">
      <input type="text" id="p1-name" placeholder="Jugador 1" value="Jugador 1">
      <input type="text" id="p2-name" placeholder="Jugador 2" value="Jugador 2">
    </div>

    <h3>Elige la Skin de la Pelota</h3>
    <div class="skins-container">
      <div class="skin-opt selected" style="background: #e74c3c;" onclick="selectSkin('#e74c3c', this)"></div>
      <div class="skin-opt" style="background: #f1c40f;" onclick="selectSkin('#f1c40f', this)"></div>
      <div class="skin-opt" style="background: #9b59b6;" onclick="selectSkin('#9b59b6', this)"></div>
      <div class="skin-opt" style="background: #3498db;" onclick="selectSkin('#3498db', this)"></div>
      <div class="skin-opt" style="background: #2ecc71;" onclick="selectSkin('#2ecc71', this)"></div>
    </div>

    <button id="btn-start">¡Empezar Duelo!</button>
  </div>

  <!-- Juego -->
  <div id="game-card" class="card hidden">
    <div class="stats">
      <span id="p1-display">J1: 0</span>
      <span id="p2-display">J2: 0</span>
    </div>

    <div class="turn-indicator" id="turn-txt">Turno de: Jugador 1</div>

    <div id="court">
      <div id="cartuchera-p1" class="cartuchera">🎒 Cartuchera</div>
      <div id="ball" class="ball" style="top: 270px; background: #e74c3c;"></div>
    </div>

    <button id="btn-throw">🚀 Lanzar Pelota</button>
    <p id="game-status" style="margin-top: 10px; color: #f1c40f; min-height: 20px;"></p>
    <button id="btn-reset" style="background: #7f8c8d; padding: 6px; font-size: 12px; margin-top: 15px;">Cambiar Nombres / Skin</button>
  </div>

  <script>
    // Variables de Juego
    let selectedSkinColor = '#e74c3c';
    let p1Name = 'Jugador 1';
    let p2Name = 'Jugador 2';
    let p1Score = 0;
    let p2Score = 0;
    let turn = 1; // 1 o 2
    let isThrowing = false;

    // Elementos DOM
    const setupCard = document.getElementById('setup-card');
    const gameCard = document.getElementById('game-card');
    const ball = document.getElementById('ball');
    const turnTxt = document.getElementById('turn-txt');
    const gameStatus = document.getElementById('game-status');

    function selectSkin(color, el) {
      selectedSkinColor = color;
      document.querySelectorAll('.skin-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    document.getElementById('btn-start').onclick = () => {
      p1Name = document.getElementById('p1-name').value.trim() || 'Jugador 1';
      p2Name = document.getElementById('p2-name').value.trim() || 'Jugador 2';
      
      p1Score = 0;
      p2Score = 0;
      turn = 1;

      ball.style.backgroundColor = selectedSkinColor;
      
      setupCard.classList.add('hidden');
      gameCard.classList.remove('hidden');
      
      updateUI();
    };

    function updateUI() {
      document.getElementById('p1-display').innerText = `${p1Name}: ${p1Score}`;
      document.getElementById('p2-display').innerText = `${p2Name}: ${p2Score}`;
      turnTxt.innerText = `Turno de: ${turn === 1 ? p1Name : p2Name}`;
    }

    document.getElementById('btn-throw').onclick = () => {
      if (isThrowing) return;
      isThrowing = true;

      // Animar Lanzamiento
      ball.style.top = '270px';
      setTimeout(() => { ball.style.top = '18px'; }, 50);

      // Calcular si encesta (50% probabilidad)
      setTimeout(() => {
        const hit = Math.random() > 0.5;

        if (hit) {
          if (turn === 1) p1Score++;
          else p2Score++;
          
          gameStatus.innerText = `🎯 ¡${turn === 1 ? p1Name : p2Name} ENCESTÓ EN LA CARTUCHERA!`;
        } else {
          gameStatus.innerText = `❌ ¡${turn === 1 ? p1Name : p2Name} falló el tiro!`;
        }

        // Cambiar turno
        turn = turn === 1 ? 2 : 1;
        updateUI();

        // Regresar pelota
        setTimeout(() => { 
          ball.style.top = '270px'; 
          isThrowing = false;
        }, 800);

      }, 450);
    };

    document.getElementById('btn-reset').onclick = () => {
      gameCard.classList.add('hidden');
      setupCard.classList.remove('hidden');
      gameStatus.innerText = '';
    };
  </script>
</body>
</html>
